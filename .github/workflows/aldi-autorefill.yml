name: ALDI AutoRefill

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: aldi-autorefill
  cancel-in-progress: false

jobs:
  check-and-refill:
    runs-on: ubuntu-latest
    environment: aldi-five-minute-delay
    container:
      image: mcr.microsoft.com/playwright/python:v1.60.0-noble
    timeout-minutes: 10
    steps:
      - name: Programm laden
        uses: actions/checkout@v4

      - name: Sperrzeit laden
        uses: actions/cache@v4
        with:
          path: .state
          key: aldi-attempt-${{ github.run_id }}
          restore-keys: |
            aldi-attempt-

      - name: Abhaengigkeiten installieren
        run: pip install --root-user-action ignore --requirement requirements.txt

      - name: Sitzung vorbereiten
        env:
          ALDI_STORAGE_STATE_B64: ${{ secrets.ALDI_STORAGE_STATE_B64 }}
        run: |
          if [ -z "$ALDI_STORAGE_STATE_B64" ]; then
            echo "Die verschluesselte ALDI-Sitzung fehlt."
            exit 1
          fi
          printf '%s' "$ALDI_STORAGE_STATE_B64" | base64 --decode > /tmp/aldi-session.json
          chmod 600 /tmp/aldi-session.json

      - name: Datenvolumen pruefen und bei Bedarf nachbuchen
        run: >-
          python cloud_runner.py
          --storage-state /tmp/aldi-session.json
          --state-file .state/attempt.json
          --threshold-mb 900
          --cooldown-minutes 10
          --execute

      - name: Sitzung aus dem Arbeitsrechner entfernen
        if: always()
        run: rm -f /tmp/aldi-session.json

  schedule-next:
    if: always()
    needs: check-and-refill
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Naechste Pruefung anfordern
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          repository = os.environ["GH_REPOSITORY"]
          url = (
              f"https://api.github.com/repos/{repository}/actions/"
              "workflows/aldi-autorefill.yml/dispatches"
          )
          request = urllib.request.Request(
              url,
              data=json.dumps({"ref": "main"}).encode("utf-8"),
              method="POST",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Content-Type": "application/json",
                  "User-Agent": "aldi-autorefill",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          for attempt in range(6):
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      if response.status != 204:
                          raise RuntimeError(
                              f"Unerwarteter GitHub-Status: {response.status}"
                          )
                  break
              except (urllib.error.HTTPError, urllib.error.URLError, TimeoutError):
                  if attempt == 5:
                      raise RuntimeError("GitHub-Folgelauf nicht erreichbar")
                  time.sleep(5 * (attempt + 1))
          PY
